services:
  db:
    image: postgres:16-alpine
    container_name: quant_platform_db
    restart: always
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
