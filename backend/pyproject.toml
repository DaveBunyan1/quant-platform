[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Quantitative finance engine featuring network graph centrality, portfolio backtesting, and factor modeling."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Dave Bunyan", email = "davebunyan.dev@gmail.com" }
]
license = "MIT"
keywords = [
    "finance",
    "quantitative",
    "fastapi",
    "centrality",
    "backtest",
    "capm",
    "fama-french",
    "structlog"
]

# TODO
dependencies = [
    # Web Framework & Async
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",

    # Database & ORM
    "sqlalchemy>=2.0.52",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",

    # Security and auth
    # TODO

    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",

    # Structured Logging & Observability
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx2>=0.27.0",        
    "ruff>=0.3.0",             
    "mypy>=1.8.0",            
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern Python syntax enforcement)
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]