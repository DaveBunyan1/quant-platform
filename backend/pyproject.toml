[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Quantitative finance engine featuring network graph centrality, portfolio backtesting, and factor modeling."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Dave Bunyan", email = "davebunyan.dev@gmail.com" }
]
license = "MIT"
keywords = [
    "finance",
    "quantitative",
    "fastapi",
    "centrality",
    "backtest",
    "capm",
    "fama-french",
    "structlog"
]

dependencies = [
    # Web Framework & Async
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",

    "python-multipart>=0.0.32",

    # Database & ORM
    "sqlalchemy>=2.0.52",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "redis>=8.1.0",

    # Security and auth
    "pwdlib>=0.3.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "PyJWT>=2.14.0",
    "starlette-csrf>=3.0.0",

    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",

    # Logging & Observability
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "prometheus-fastapi-instrumentator>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx2>=0.27.0",        
    "ruff>=0.3.0",             
    "mypy>=1.8.0",
    "asgi-lifespan>=2.1.0"         
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern Python syntax enforcement)
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Body"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers =[
    "unit: pure unit tests (no DB)",
    "integration: tests that need the database"
]
filterwarnings = "ignore::DeprecationWarning"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]