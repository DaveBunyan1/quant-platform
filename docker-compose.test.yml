services:
  db-test:
    image: postgres:16-alpine
    container_name: quant_platform_db_test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: quant_platform_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d quant_platform_test"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
